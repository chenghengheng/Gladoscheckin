name: Check-in regression tests

on:
  pull_request:
    paths:
      - 'checkin.py'
      - 'test_checkin.py'
      - '.github/workflows/checkin-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3' pypushdeer
      - name: Offline unit tests (no GLaDOS credentials)
        run: python -m unittest -v test_checkin
