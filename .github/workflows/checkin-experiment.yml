name: check-in request experiment

on:
  workflow_dispatch:

jobs:
  test:
    name: test JSON check-in request
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypushdeer

      - name: Run check-in experiment
        run: python checkin.py
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
          GLADOS_EXCHANGE_PLAN: plan500
          GLADOS_SKIP_EXCHANGE: "true"
          GLADOS_VERBOSE: "true"
